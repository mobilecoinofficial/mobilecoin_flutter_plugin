name: build

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

env:
  FLUTTER_VERSION: 3.27.2

jobs:
  dart:
    runs-on: mco-dev-small-x64
    timeout-minutes: 15
    steps:
      - name: 'Checkout Repo'
        uses: actions/checkout@v2
        with:
          fetch-depth: 0 # to get all branches and tags

      - name: 'Cache Flutter'
        id: flutter-cache
        uses: actions/cache@v4
        with:
          key: ${{ runner.OS }}-flutter-install-cache-${{ env.FLUTTER_VERSION }}
          path: ${{ runner.tool_cache }}/flutter

      - name: 'Cache Flutter dependencies'
        id: pub-cache
        uses: actions/cache@v4
        with:
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          path: |
            ${{ env.FLUTTER_HOME }}/.pub-cache
            **/.packages
            **/.flutter-plugins
            **/.flutter-plugin-dependencies
            **/.dart_tool/package_config.json

      - name: 'Install Flutter archive dependencies'
        if: steps.flutter-cache.cache.outputs.cache-hit != 'true'
        run: sudo apt-get update && sudo apt-get install -y zstd xz-utils

      - name: 'Set Flutter version'
        if: steps.flutter-cache.cache.outputs.cache-hit != 'true'
        uses: subosito/flutter-action@v1
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: 'Install Dart dependencies'
        if: steps.pub-cache.cache.outputs.cache-hit != 'true'
        run: flutter pub get;

      - name: 'Format'
        run: dart format $(find . -name "*.dart" -not -wholename "*/generated/*") --set-exit-if-changed

      - uses: invertase/github-action-dart-analyzer@v1
        with:
          fatal-infos: true
          fatal-warnings: true
          annotate: true
          working-directory: ./lib

      - name: 'Run unit tests'
        run: flutter test --no-pub --coverage --test-randomize-ordering-seed random

  android:
    runs-on: mco-dev-large-x64
    timeout-minutes: 15
    steps:
      - name: 'Checkout Repo'
        uses: actions/checkout@v2
        with:
          fetch-depth: 0 # to get all branches and tags

      - name: 'Set Java version'
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: 'Cache Flutter'
        id: flutter-cache
        uses: actions/cache@v4
        with:
          key: ${{ runner.OS }}-flutter-install-cache-${{ env.FLUTTER_VERSION }}
          path: ${{ runner.tool_cache }}/flutter

      - name: 'Cache Flutter dependencies'
        id: pub-cache
        uses: actions/cache@v4
        with:
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          path: |
            ${{ env.FLUTTER_HOME }}/.pub-cache
            **/.packages
            **/.flutter-plugins
            **/.flutter-plugin-dependencies
            **/.dart_tool/package_config.json

      - name: 'Install Flutter archive dependencies'
        if: steps.flutter-cache.cache.outputs.cache-hit != 'true'
        run: sudo apt-get update && sudo apt-get install -y zstd xz-utils

      - name: 'Set Flutter version'
        if: steps.flutter-cache.cache.outputs.cache-hit != 'true'
        uses: subosito/flutter-action@v1
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: 'Install Dart dependencies'
        if: steps.pub-cache.cache.outputs.cache-hit != 'true'
        run: flutter pub get;

      - name: 'Setup Android SDK'
        uses: amyu/setup-android@v5

      - name: 'Build example'
        run: |
          cd ${{ github.workspace }}/example;
          flutter build apk;

      - name: 'Run native unit tests'
        run: |
          cd ${{ github.workspace }}/example/android;
          ./gradlew :mobilecoin_flutter:testDebugUnitTest;

  ios:
    runs-on: macos-14-xlarge
    timeout-minutes: 25
    steps:
      - name: 'Checkout Repo'
        uses: actions/checkout@v2
        with:
          fetch-depth: 0 # to get all branches and tags

      - name: 'Cache Flutter'
        id: flutter-cache
        uses: actions/cache@v4
        with:
          key: ${{ runner.OS }}-flutter-install-cache-${{ env.FLUTTER_VERSION }}
          path: /Users/runner/hostedtoolcache/flutter

      - name: 'Cache Flutter dependencies'
        id: pub-cache
        uses: actions/cache@v4
        with:
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          path: |
            ${{ env.FLUTTER_HOME }}/.pub-cache
            **/.packages
            **/.flutter-plugins
            **/.flutter-plugin-dependencies
            **/.dart_tool/package_config.json

      - name: 'Cache Ruby dependencies'
        id: ruby-cache
        uses: actions/cache@v4
        with:
          key: ${{ runner.os }}-gems-${{ hashFiles('**/Gemfile') }}
          path: ${{ github.workspace }}/vendor/bundle

      - name: 'Cache Pods'
        id: pod-cache
        uses: actions/cache@v4
        with:
          key: ${{ runner.os }}-pods-${{ hashFiles('**/Podfile.lock') }}
          path: ${{ github.workspace }}/example/ios/Pods

      - name: 'Set Flutter version'
        if: steps.flutter-cache.cache.outputs.cache-hit != 'true'
        uses: subosito/flutter-action@v1
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: 'Set Ruby version'
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '2.7.2'

      - name: 'Set Xcode version'
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.2.0'

      - name: 'Install Dart dependencies'
        if: steps.pub-cache.cache.outputs.cache-hit != 'true'
        run: flutter pub get

      - name: 'Install Ruby dependencies'
        if: steps.ruby-cache.cache.outputs.cache-hit != 'true'
        run: |
          bundle config path ${{ github.workspace }}/vendor/bundle;
          cd ${{ github.workspace }}/example/ios;
          bundle install;

      - name: 'Update CocoaPods specs'
        run: |
          bundle config path ${{ github.workspace }}/vendor/bundle;
          cd ${{ github.workspace }}/example/ios;
          bundle exec pod repo update;

      - name: 'Build example'
        run: |
          cd ${{ github.workspace }}/example;
          flutter build ios --simulator;

      - name: 'Run native unit tests'
        run: |
          cd ${{ github.workspace }}/example/ios;
          udid=$(xcrun simctl list devices available \
            | sed -n '/-- iOS/,/^-- /p' \
            | grep -m1 -oE '[0-9A-F]{8}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{12}');
          test -n "$udid";
          xcodebuild test \
            -workspace Runner.xcworkspace \
            -scheme Runner \
            -destination "platform=iOS Simulator,id=$udid" \
            -only-testing:RunnerTests \
            CODE_SIGNING_ALLOWED=NO;
