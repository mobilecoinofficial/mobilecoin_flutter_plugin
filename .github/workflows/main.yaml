name: build

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

env:
  FLUTTER_VERSION: 3.41.3

jobs:
  dart:
    runs-on: mco-dev-small-x64
    timeout-minutes: 15
    steps:
      - name: 'Checkout Repo'
        uses: actions/checkout@v2
        with:
          fetch-depth: 0 # to get all branches and tags

      - name: 'Cache Flutter'
        id: flutter-cache
        uses: actions/cache@v4
        with:
          key: ${{ runner.OS }}-flutter-install-cache-${{ env.FLUTTER_VERSION }}
          path: ${{ runner.tool_cache }}/flutter

      - name: 'Cache Flutter dependencies'
        id: pub-cache
        uses: actions/cache@v4
        with:
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          path: |
            ${{ env.FLUTTER_HOME }}/.pub-cache
            **/.packages
            **/.flutter-plugins
            **/.flutter-plugins-dependencies
            **/.dart_tool/package_config.json

      - name: 'Install Flutter archive dependencies'
        if: steps.flutter-cache.cache.outputs.cache-hit != 'true'
        run: sudo apt-get update && sudo apt-get install -y zstd xz-utils

      - name: 'Set Flutter version'
        if: steps.flutter-cache.cache.outputs.cache-hit != 'true'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: 'Install Dart dependencies'
        if: steps.pub-cache.cache.outputs.cache-hit != 'true'
        run: flutter pub get;

      - name: 'Format'
        run: dart format $(find . -name "*.dart" -not -wholename "*/generated/*") --set-exit-if-changed

      - uses: invertase/github-action-dart-analyzer@v1
        with:
          fatal-infos: true
          fatal-warnings: true
          annotate: true
          working-directory: ./lib

      - name: 'Run unit tests'
        run: flutter test --no-pub --coverage --test-randomize-ordering-seed random

  android:
    runs-on: mco-dev-large-x64
    timeout-minutes: 15
    steps:
      - name: 'Checkout Repo'
        uses: actions/checkout@v2
        with:
          fetch-depth: 0 # to get all branches and tags

      - name: 'Set Java version'
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: 'Cache Flutter'
        id: flutter-cache
        uses: actions/cache@v4
        with:
          key: ${{ runner.OS }}-flutter-install-cache-${{ env.FLUTTER_VERSION }}
          path: ${{ runner.tool_cache }}/flutter

      - name: 'Cache Flutter dependencies'
        id: pub-cache
        uses: actions/cache@v4
        with:
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          path: |
            ${{ env.FLUTTER_HOME }}/.pub-cache
            **/.packages
            **/.flutter-plugins
            **/.flutter-plugins-dependencies
            **/.dart_tool/package_config.json

      - name: 'Install Flutter archive dependencies'
        if: steps.flutter-cache.cache.outputs.cache-hit != 'true'
        run: sudo apt-get update && sudo apt-get install -y zstd xz-utils

      - name: 'Set Flutter version'
        if: steps.flutter-cache.cache.outputs.cache-hit != 'true'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: 'Install Dart dependencies'
        if: steps.pub-cache.cache.outputs.cache-hit != 'true'
        run: flutter pub get;

      - name: 'Setup Android SDK'
        uses: amyu/setup-android@v5

      - name: 'Build example'
        run: |
          cd ${{ github.workspace }}/example;
          flutter build apk;

      - name: 'Run native unit tests'
        run: |
          cd ${{ github.workspace }}/example/android;
          ./gradlew :mobilecoin_flutter:testDebugUnitTest;

  ios:
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - name: 'Checkout Repo'
        uses: actions/checkout@v2
        with:
          fetch-depth: 0 # to get all branches and tags

      - name: 'Cache Flutter'
        id: flutter-cache
        uses: actions/cache@v4
        with:
          key: ${{ runner.OS }}-flutter-install-cache-${{ env.FLUTTER_VERSION }}
          path: /Users/runner/hostedtoolcache/flutter

      - name: 'Cache Flutter dependencies'
        id: pub-cache
        uses: actions/cache@v4
        with:
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          path: |
            ${{ env.FLUTTER_HOME }}/.pub-cache
            **/.packages
            **/.flutter-plugins
            **/.flutter-plugins-dependencies
            **/.dart_tool/package_config.json

      - name: 'Set Flutter version'
        if: steps.flutter-cache.cache.outputs.cache-hit != 'true'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: 'Set Xcode version'
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.3.0'

      - name: 'Install Dart dependencies'
        if: steps.pub-cache.cache.outputs.cache-hit != 'true'
        run: flutter pub get

      - name: 'Check both Package.resolved copies agree'
        run: |
          cd ${{ github.workspace }}/example/ios;
          # Each container holds its own copy and a resolve updates only the one it ran
          # in, so resolving through Runner.xcodeproj alone leaves the copy CI reads stale.
          cmp Runner.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved \
              Runner.xcworkspace/xcshareddata/swiftpm/Package.resolved;

      - name: 'Build example'
        run: |
          cd ${{ github.workspace }}/example;
          flutter build ios --simulator;

      - name: 'Run native unit tests'
        run: |
          cd ${{ github.workspace }}/example/ios;
          udid=$(xcrun simctl list devices available \
            | sed -n '/-- iOS/,/^-- /p' \
            | grep -m1 -oE '[0-9A-F]{8}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{12}');
          test -n "$udid";
          log="${RUNNER_TEMP:-/tmp}/xcodebuild-test.log";
          set -o pipefail;
          xcodebuild test \
            -workspace Runner.xcworkspace \
            -scheme Runner \
            -destination "platform=iOS Simulator,id=$udid" \
            -only-testing:RunnerTests \
            CODE_SIGNING_ALLOWED=NO | tee "$log";
          # xcodebuild reports a run that executed nothing as TEST SUCCEEDED, so
          # a green lane would otherwise say the same thing whether these tests
          # ran or stopped being found at all.
          executed=$(grep -oE 'Executed [0-9]+ test' "$log" \
            | grep -oE '[0-9]+' | sort -rn | head -1);
          echo "executed $executed tests";
          test -n "$executed" && test "$executed" -gt 0;
